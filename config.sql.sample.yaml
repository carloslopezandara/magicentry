# Sample configuration for MagicEntry using SQLite database for user storage

# Server configuration
host: "localhost"
port: 8080
public_url: "http://localhost:8080"

# Database for storing secrets (required)
database_url: "sqlite:data.db"

# Optional: Configure additional features
# otp_length: 6
# otp_prefix: "MGC"
# otp_expiry: 600  # in seconds

# SQLite user storage configuration
users_sql:
  # Database connection string - supports multiple database types:
  # - SQLite: "sqlite:database.db" 
  # - PostgreSQL: "postgresql://user:pass@host/db"
  # - MySQL: "mysql://user:pass@host/db"
  connection_string: "sqlite:users.db"
  
  # Custom SQL query to fetch user data
  # REQUIREMENTS:
  #   1. Must be a SELECT statement
  #   2. Must return these exact column names (use aliases to map):
  #      - id: unique user identifier (will be used as username)
  #      - email: user's email address
  #      - name: user's display name  
  #      - realms: user permissions/roles (JSON array or comma-separated string)
  #   3. Query cannot be empty
  #
  # These 4 columns match the YAML structure:
  #   YAML field    -> SQL column
  #   username      -> id
  #   email         -> email  
  #   name          -> name
  #   realms        -> realms
  query: >
    SELECT 
      user_id as id,
      email_address as email,
      display_name as name,
      permissions as realms
    FROM users 
    WHERE email_address = ?

